name: Build and upload to PyPI

on:
  pull_request:
  release:
    types:
      - published

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.0

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: '3.11'

      - name: Test against oldest supported numpy version
        shell: bash
        run: |
            python -m pip install ./wheelhouse/*cp311*.whl
            python -m pip install numpy==1.26.4 scipy==1.17 pytest
            pytest --pyargs nlsam --verbose

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-nlsam_${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: '3.13'

      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build_pyinstaller:
    name: Build pyinstaller on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: '3.13'

      - name: Get pyinstaller
        shell: bash
        run: |
          pip install pyinstaller
          pip install -e .

          echo "version=v$(python -c "from importlib.metadata import version; print(version('nlsam'));")" >> $GITHUB_ENV
          pyinstaller ./nlsam/script.py -n nlsam_denoising -F --clean --noupx
          mv ./dist/nlsam_denoising* ./
          ./nlsam_denoising* --help

      - uses: actions/upload-artifact@v7
        with:
          name: nlsam_${{ env.version }}_${{ runner.os }}_${{ runner.arch }}
          path: |
                nlsam_denoising
                nlsam_denoising.exe
                CHANGELOG.md
                README.md
                LICENSE
                example/*

  build_doc:
  name: Build docs
    needs: build_wheels
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v7

     - uses: actions/setup-python@v7
       name: Install Python
       with:
         python-version: '3.13'

     - name: Make doc
       run: |
         python -m pip install pdoc
         python -m pip install wheelhouse/*cp313*.whl
         pdoc nlsam/ !nlsam.tests -o docs/ --math

     - uses: actions/upload-pages-artifact@v5
       with:
         path: docs/

  # Deploy the artifact to GitHub pages.
  # This is a separate job so that only actions/deploy-pages has the necessary permissions.
  deploy_doc:
    needs: build_sdist
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
